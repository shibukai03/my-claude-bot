name: Manual - Windows v2034.2 Install Test

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to test (e.g. 2034.2)'
        required: true
        default: '2034.2'

jobs:
  # ----------------------------------------------------------------
  # Approach A: Customer command from memory (KNOWN BROKEN — kept for regression)
  # ----------------------------------------------------------------
  test-customer-command:
    runs-on: windows-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: Customer command (memo verbatim, EXPECTED TO FAIL on scripts/ missing)
        shell: powershell
        run: |
          $V = "${{ inputs.version }}"
          New-Item -ItemType Directory -Force -Path "$env:TEMP\sl-update" | Out-Null
          Set-Location "$env:TEMP\sl-update"
          iwr -useb "https://github.com/onukih-design/soloptilink-releases/releases/download/v$V/soloptilink-update-v$V.tar.gz" -OutFile sl.tar.gz
          tar -xzf sl.tar.gz
          New-Item -ItemType Directory -Force -Path "$HOME\.claude\skills","$HOME\.soloptilink" | Out-Null
          Copy-Item -Recurse -Force "soloptilink-v$V\skills\*" "$HOME\.claude\skills\"
          Copy-Item -Recurse -Force "soloptilink-v$V\chain.sh","soloptilink-v$V\lib","soloptilink-v$V\scripts","soloptilink-v$V\installer" "$HOME\.soloptilink\"

  # ----------------------------------------------------------------
  # Approach B: Use the bundled installer/soloptilink-install.ps1 (proper path)
  # ----------------------------------------------------------------
  test-bundled-installer:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: System info
        shell: powershell
        run: |
          Write-Host "OS: $([Environment]::OSVersion.VersionString)"
          Write-Host "PowerShell: $($PSVersionTable.PSVersion)"
          Write-Host "Architecture: $env:PROCESSOR_ARCHITECTURE"
          Write-Host "HOME: $HOME"

      - name: Download tarball + extract installer
        shell: powershell
        run: |
          $V = "${{ inputs.version }}"
          New-Item -ItemType Directory -Force -Path "$env:TEMP\sl-update" | Out-Null
          Set-Location "$env:TEMP\sl-update"
          iwr -useb "https://github.com/onukih-design/soloptilink-releases/releases/download/v$V/soloptilink-update-v$V.tar.gz" -OutFile "soloptilink-update-v$V.tar.gz"
          Write-Host "=== tar.gz downloaded ==="
          Get-Item "soloptilink-update-v$V.tar.gz" | Format-Table Name, Length
          # Extract everything so we can grab the installer
          tar -xzf "soloptilink-update-v$V.tar.gz"
          Write-Host "=== extracted contents ==="
          Get-ChildItem "soloptilink-v$V" | Format-Table Name, Mode
          Write-Host "=== installer/ ==="
          Get-ChildItem "soloptilink-v$V\installer" | Format-Table Name, Length

      - name: Download Windows launcher binary
        shell: powershell
        run: |
          $V = "${{ inputs.version }}"
          $BIN_ARCH = if ($env:PROCESSOR_ARCHITECTURE -eq 'ARM64') { 'arm64' } else { 'amd64' }
          Write-Host "Binary arch: $BIN_ARCH"
          New-Item -ItemType Directory -Force -Path "$HOME\.soloptilink" | Out-Null
          iwr -useb "https://github.com/onukih-design/soloptilink-releases/releases/download/v$V/soloptilink-windows-$BIN_ARCH.exe" -OutFile "$HOME\.soloptilink\soloptilink.exe"
          Get-Item "$HOME\.soloptilink\soloptilink.exe" | Format-Table Name, Length

      - name: Run bundled installer (soloptilink-install.ps1)
        shell: powershell
        run: |
          $V = "${{ inputs.version }}"
          Set-Location "$env:TEMP\sl-update"
          $installer = "soloptilink-v$V\installer\soloptilink-install.ps1"
          $tarball = "$PWD\soloptilink-update-v$V.tar.gz"
          Write-Host "=== Invoking installer ==="
          Write-Host "  Installer: $installer"
          Write-Host "  Tarball:   $tarball"
          # Installer uses End-Pause / ReadKey which would hang in CI; we set Host.Name check to avoid it
          # The installer checks $Host.Name -eq "ConsoleHost" — in GA powershell it IS ConsoleHost
          # So we need to feed input. Workaround: pipe Enter key
          # Actually simpler: invoke with a redirected stdin
          $process = Start-Process powershell -ArgumentList "-NoProfile","-ExecutionPolicy","Bypass","-File",$installer,"-TarballPath",$tarball -Wait -PassThru -NoNewWindow -RedirectStandardInput "NUL"
          Write-Host "=== Installer exit code: $($process.ExitCode) ==="
          if ($process.ExitCode -ne 0) {
            Write-Host "Installer failed"
            exit 1
          }

      - name: Sync skills to ~/.claude/skills/
        shell: powershell
        run: |
          # Installer extracts to ~/.soloptilink/ (including skills/) but Claude Code reads from ~/.claude/skills/
          New-Item -ItemType Directory -Force -Path "$HOME\.claude\skills" | Out-Null
          if (Test-Path "$HOME\.soloptilink\skills") {
            Copy-Item -Recurse -Force "$HOME\.soloptilink\skills\*" "$HOME\.claude\skills\"
            Write-Host "Skills synced to ~/.claude/skills/"
          } else {
            Write-Host "WARNING: ~/.soloptilink/skills/ not found"
            exit 1
          }

      - name: Verify --version
        shell: powershell
        run: |
          $V = "${{ inputs.version }}"
          $versionOutput = & "$HOME\.soloptilink\soloptilink.exe" --version 2>&1
          Write-Host "=== --version output ==="
          Write-Host $versionOutput
          $expected = "v$V"
          if ($versionOutput -match [regex]::Escape($expected)) {
            Write-Host "OK Version verified: contains $expected"
          } else {
            Write-Host "FAIL Version output does not contain '$expected'"
            exit 1
          }

      - name: Verify file completeness
        shell: powershell
        run: |
          $errors = @()
          $checks = @{
            "soloptilink.exe" = "$HOME\.soloptilink\soloptilink.exe"
            "chain.sh"        = "$HOME\.soloptilink\chain.sh"
            "lib/"            = "$HOME\.soloptilink\lib"
            "lib/license-guard.sh" = "$HOME\.soloptilink\lib\license-guard.sh"
            "lib/core/layer-loader.sh" = "$HOME\.soloptilink\lib\core\layer-loader.sh"
            "installer/"      = "$HOME\.soloptilink\installer"
            "agents/"         = "$HOME\.soloptilink\agents"
            "hooks/"          = "$HOME\.soloptilink\hooks"
            "migration/"      = "$HOME\.soloptilink\migration"
            "skills/ in ~/.soloptilink" = "$HOME\.soloptilink\skills"
            "skills/ in ~/.claude" = "$HOME\.claude\skills"
            "VERSION"         = "$HOME\.soloptilink\VERSION"
            "version-manifest.json" = "$HOME\.soloptilink\version-manifest.json"
            "setup.sh"        = "$HOME\.soloptilink\setup.sh"
            "auto-update.sh"  = "$HOME\.soloptilink\auto-update.sh"
          }
          foreach ($name in $checks.Keys) {
            $path = $checks[$name]
            if (Test-Path $path) {
              Write-Host "OK   $name"
            } else {
              Write-Host "FAIL $name  ($path)"
              $errors += $name
            }
          }

          # Component counts from manifest
          if (Test-Path "$HOME\.soloptilink\version-manifest.json") {
            $manifest = Get-Content "$HOME\.soloptilink\version-manifest.json" -Raw | ConvertFrom-Json
            $skillCount = (Get-ChildItem "$HOME\.claude\skills" -ErrorAction SilentlyContinue).Count
            $agentCount = (Get-ChildItem "$HOME\.soloptilink\agents" -Recurse -ErrorAction SilentlyContinue | Where-Object { -not $_.PSIsContainer }).Count
            $libCount = (Get-ChildItem "$HOME\.soloptilink\lib" -Recurse -ErrorAction SilentlyContinue | Where-Object { -not $_.PSIsContainer }).Count
            Write-Host ""
            Write-Host "=== Component counts vs manifest ==="
            Write-Host "skills:  installed=$skillCount   manifest=$($manifest.components.skills)"
            Write-Host "agents:  installed=$agentCount   manifest=$($manifest.components.agents)"
            Write-Host "lib:     installed=$libCount     manifest=$($manifest.components.lib_modules)"
          }

          if ($errors.Count -gt 0) {
            Write-Host ""
            Write-Host "=== FAILURES: $($errors.Count) ==="
            exit 1
          } else {
            Write-Host ""
            Write-Host "=== ALL CHECKS PASSED ==="
          }

      - name: Manifest dump (always)
        if: always()
        shell: powershell
        run: |
          Write-Host "=== ~/.soloptilink top-level ==="
          Get-ChildItem "$HOME\.soloptilink" -ErrorAction SilentlyContinue | Format-Table Name, Length
          Write-Host "=== ~/.claude/skills ==="
          Get-ChildItem "$HOME\.claude\skills" -ErrorAction SilentlyContinue | Format-Table Name

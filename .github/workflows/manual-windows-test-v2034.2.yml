name: Manual - Windows v2034.2 Install Test

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to test (e.g. 2034.2)'
        required: true
        default: '2034.2'

jobs:
  # ============================================================
  # Job: test the NEW FIXED customer command (proposed for distribution)
  # ============================================================
  test-fixed-command:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: System info
        shell: powershell
        run: |
          Write-Host "OS: $([Environment]::OSVersion.VersionString)"
          Write-Host "PowerShell: $($PSVersionTable.PSVersion)"
          Write-Host "Architecture: $env:PROCESSOR_ARCHITECTURE"
          Write-Host "HOME: $HOME"

      - name: Fixed customer install command (v2034.2 amd64/arm64)
        shell: powershell
        run: |
          $V = "${{ inputs.version }}"
          $ErrorActionPreference = "Stop"
          $tempDir = Join-Path $env:TEMP "sl-update-$V"
          try {
              New-Item -ItemType Directory -Force -Path $tempDir | Out-Null
              Set-Location $tempDir

              Write-Host "[1/6] tar.gz をダウンロード中..."
              $tarUrl = "https://github.com/onukih-design/soloptilink-releases/releases/download/v$V/soloptilink-update-v$V.tar.gz"
              iwr -useb $tarUrl -OutFile "sl.tar.gz"
              if (-not (Test-Path "sl.tar.gz") -or (Get-Item "sl.tar.gz").Length -lt 1MB) { throw "tar.gz ダウンロード失敗 (size不足)" }
              Write-Host "  OK: $((Get-Item 'sl.tar.gz').Length) bytes"

              Write-Host "[2/6] バイナリをダウンロード中..."
              $BIN_ARCH = if ($env:PROCESSOR_ARCHITECTURE -eq 'ARM64') { 'arm64' } else { 'amd64' }
              New-Item -ItemType Directory -Force -Path "$HOME\.soloptilink","$HOME\.claude\skills" | Out-Null
              $binUrl = "https://github.com/onukih-design/soloptilink-releases/releases/download/v$V/soloptilink-windows-$BIN_ARCH.exe"
              iwr -useb $binUrl -OutFile "$HOME\.soloptilink\soloptilink.exe"
              if (-not (Test-Path "$HOME\.soloptilink\soloptilink.exe") -or (Get-Item "$HOME\.soloptilink\soloptilink.exe").Length -lt 1MB) { throw "バイナリダウンロード失敗 ($BIN_ARCH)" }
              Write-Host "  OK: $BIN_ARCH / $((Get-Item "$HOME\.soloptilink\soloptilink.exe").Length) bytes"

              Write-Host "[3/6] tarball を ~/.soloptilink/ に展開中..."
              # --strip-components=1 で soloptilink-v$V/ プレフィックスを剥がす
              # --exclude='._*' で macOS の AppleDouble メタデータを除外
              & tar -xzf "sl.tar.gz" -C "$HOME\.soloptilink" --strip-components=1 --exclude='._*'
              if ($LASTEXITCODE -ne 0) { throw "tar 展開失敗 (exit=$LASTEXITCODE)" }
              if (-not (Test-Path "$HOME\.soloptilink\lib\license-guard.sh")) { throw "展開後の lib/license-guard.sh が見つかりません" }
              if (-not (Test-Path "$HOME\.soloptilink\chain.sh")) { throw "展開後の chain.sh が見つかりません" }
              Write-Host "  OK: lib/license-guard.sh, chain.sh 存在確認"

              Write-Host "[4/6] skills を Claude Code 側へ sync..."
              if (-not (Test-Path "$HOME\.soloptilink\skills")) { throw "~/.soloptilink/skills が見つかりません" }
              Copy-Item -Recurse -Force "$HOME\.soloptilink\skills\*" "$HOME\.claude\skills\"
              $skillCount = (Get-ChildItem "$HOME\.claude\skills" -ErrorAction SilentlyContinue).Count
              Write-Host "  OK: $skillCount skills"

              Write-Host "[5/6] .sh の CRLF -> LF 正規化..."
              $fixedCount = 0
              Get-ChildItem "$HOME\.soloptilink" -Filter "*.sh" -Recurse -ErrorAction SilentlyContinue | ForEach-Object {
                  try {
                      $bytes = [System.IO.File]::ReadAllBytes($_.FullName)
                      if ($bytes -contains 13) {
                          $text = [System.IO.File]::ReadAllText($_.FullName) -replace "`r`n","`n" -replace "`r","`n"
                          [System.IO.File]::WriteAllText($_.FullName, $text, [System.Text.UTF8Encoding]::new($false))
                          $fixedCount++
                      }
                  } catch {}
              }
              Write-Host "  OK: $fixedCount ファイル修正"

              Write-Host "[6/6] バージョン確認..."
              $versionOut = & "$HOME\.soloptilink\soloptilink.exe" --version 2>&1
              Write-Host "  $versionOut"
              if ($versionOut -notmatch "v$V") { throw "バージョン不一致: '$versionOut' に v$V が含まれていません" }

              Write-Host ""
              Write-Host "================================================"
              Write-Host "  v$V 完全更新完了"
              Write-Host "================================================"
              Write-Host "  ~/.soloptilink/  : $((Get-ChildItem "$HOME\.soloptilink").Count) items"
              Write-Host "  ~/.claude/skills/: $skillCount skills"
          }
          catch {
              Write-Host ""
              Write-Host "================================================" -ForegroundColor Red
              Write-Host "  失敗: $_" -ForegroundColor Red
              Write-Host "================================================" -ForegroundColor Red
              exit 1
          }
          finally {
              if (Test-Path $tempDir) { Remove-Item -Recurse -Force $tempDir -ErrorAction SilentlyContinue }
          }

      - name: Verify full file completeness
        shell: powershell
        run: |
          $errors = @()
          $checks = @{
            "soloptilink.exe" = "$HOME\.soloptilink\soloptilink.exe"
            "chain.sh"        = "$HOME\.soloptilink\chain.sh"
            "lib/"            = "$HOME\.soloptilink\lib"
            "lib/license-guard.sh" = "$HOME\.soloptilink\lib\license-guard.sh"
            "lib/core/layer-loader.sh" = "$HOME\.soloptilink\lib\core\layer-loader.sh"
            "installer/"      = "$HOME\.soloptilink\installer"
            "agents/"         = "$HOME\.soloptilink\agents"
            "hooks/"          = "$HOME\.soloptilink\hooks"
            "migration/"      = "$HOME\.soloptilink\migration"
            "skills/ in ~/.soloptilink" = "$HOME\.soloptilink\skills"
            "skills/ in ~/.claude" = "$HOME\.claude\skills"
            "VERSION"         = "$HOME\.soloptilink\VERSION"
            "version-manifest.json" = "$HOME\.soloptilink\version-manifest.json"
            "setup.sh"        = "$HOME\.soloptilink\setup.sh"
            "auto-update.sh"  = "$HOME\.soloptilink\auto-update.sh"
          }
          foreach ($name in $checks.Keys) {
            if (Test-Path $checks[$name]) {
              Write-Host "OK   $name"
            } else {
              Write-Host "FAIL $name"
              $errors += $name
            }
          }

          # AppleDouble metadata should be excluded by --exclude='._*'
          $appleDoubleFiles = Get-ChildItem "$HOME\.soloptilink" -Recurse -Filter "._*" -ErrorAction SilentlyContinue
          if ($appleDoubleFiles.Count -gt 0) {
            Write-Host "WARN: $($appleDoubleFiles.Count) AppleDouble (._*) files remain — exclude not effective"
          } else {
            Write-Host "OK   AppleDouble (._*) excluded"
          }

          # Component counts
          if (Test-Path "$HOME\.soloptilink\version-manifest.json") {
            $manifest = Get-Content "$HOME\.soloptilink\version-manifest.json" -Raw | ConvertFrom-Json
            $skillCount = (Get-ChildItem "$HOME\.claude\skills" -ErrorAction SilentlyContinue).Count
            $agentCount = (Get-ChildItem "$HOME\.soloptilink\agents" -Recurse -ErrorAction SilentlyContinue | Where-Object { -not $_.PSIsContainer }).Count
            $libCount = (Get-ChildItem "$HOME\.soloptilink\lib" -Recurse -ErrorAction SilentlyContinue | Where-Object { -not $_.PSIsContainer }).Count
            Write-Host ""
            Write-Host "=== Component counts vs manifest (should now match) ==="
            Write-Host "skills:  installed=$skillCount   manifest=$($manifest.components.skills)"
            Write-Host "agents:  installed=$agentCount   manifest=$($manifest.components.agents)"
            Write-Host "lib:     installed=$libCount     manifest=$($manifest.components.lib_modules)"
          }

          if ($errors.Count -gt 0) { exit 1 } else { Write-Host ""; Write-Host "=== ALL CHECKS PASSED ===" }

      - name: Manifest dump (always)
        if: always()
        shell: powershell
        run: |
          Write-Host "=== ~/.soloptilink top-level ==="
          Get-ChildItem "$HOME\.soloptilink" -ErrorAction SilentlyContinue | Format-Table Name
          Write-Host "=== ~/.claude/skills ==="
          Get-ChildItem "$HOME\.claude\skills" -ErrorAction SilentlyContinue | Format-Table Name
